<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/icone-uniasselvi.png" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="57x57" href="assets/favicons/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="assets/favicons/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="assets/favicons/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="assets/favicons/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="assets/favicons/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="assets/favicons/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="assets/favicons/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="assets/favicons/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicons/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/favicons/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="assets/favicons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicons/favicon-16x16.png">
    <link rel="manifest" href="manifest.json">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="/ms-icon-144x144.png">
    <meta name="theme-color" content="#ffffff">

    <title>Acervo de Jogos Educativos</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        #container-menu,
        #container-jogo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        #container-jogo {
            visibility: hidden;
            pointer-events: none;
            z-index: -1;
            background-color: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }

        *:focus-visible {
            outline: 3px solid #FFD700;
            outline-offset: 3px;
        }

        #aria-announcer {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        #btn-voltar-menu {
            display: none;
            position: absolute;
            bottom: 12px;
            right: 12px;
            z-index: 9999;
            padding: 10px 18px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            border: 2px solid #fff;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-family: Arial, sans-serif;
        }

        #btn-voltar-menu:hover,
        #btn-voltar-menu:focus-visible {
            background: rgba(255, 255, 255, 0.2);
            outline: 3px solid #FFD700;
        }

        #btn-resetar-progresso {
            position: absolute;
            bottom: 14px;
            right: 14px;
            z-index: 50;
            width: 44px;
            height: 44px;
            padding: 0;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.6);
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            font-family: Arial, sans-serif;
        }

        #btn-resetar-progresso:hover,
        #btn-resetar-progresso:focus-visible {
            background: rgba(255, 255, 255, 0.2);
            outline: 3px solid #FFD700;
        }

        #tela-certificado {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #tela-certificado .certificado-cartao {
            background: #fff;
            color: #222;
            border-radius: 16px;
            padding: clamp(20px, 4vw, 48px);
            max-width: 560px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 6px solid #FFD700;
        }

        #tela-certificado h2 {
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            margin: 0 0 12px;
            color: #1e6b3c;
        }

        #tela-certificado p {
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            line-height: 1.4;
            margin: 0 0 24px;
        }

        #tela-certificado .certificado-botoes {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        #tela-certificado button {
            min-height: 48px;
            padding: 12px 22px;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            font-family: Arial, sans-serif;
        }

        #btn-jogar-de-novo {
            background: #27ae60;
            color: #fff;
        }

        #btn-continuar-certificado {
            background: #e0e0e0;
            color: #222;
        }

        #tela-certificado button:focus-visible {
            outline: 3px solid #FFD700;
            outline-offset: 2px;
        }
    </style>
</head>

<body>

    <div
        id="container-menu"
    >
        <button id="btn-resetar-progresso" aria-label="Reiniciar progresso dos jogos" title="Reiniciar progresso">⟳</button>
    </div>

    <div
        id="container-jogo"
        role="region"
        aria-label="Área do jogo em execução"
    ></div>

    <button id="btn-voltar-menu" aria-label="Voltar ao menu de jogos">
        ← Voltar ao Menu
    </button>

    <div id="tela-certificado" role="dialog" aria-modal="true" aria-labelledby="certificado-titulo">
        <div class="certificado-cartao">
            <h2 id="certificado-titulo">🏆 Certificado de Agente Mirim</h2>
            <p>Parabéns! Você completou todos os jogos do Acervo da Defesa Civil e agora é um Agente Mirim da prevenção!</p>
            <div class="certificado-botoes">
                <button id="btn-jogar-de-novo">Jogar de novo</button>
                <button id="btn-continuar-certificado">Continuar</button>
            </div>
        </div>
    </div>

    <div id="aria-announcer" aria-live="assertive" aria-atomic="true"></div>

    <script src="config-jogos.js"></script>
    <script src="progresso.js"></script>
    <script src="evento-ponte.js"></script>
    <script src="phaser.min.js"></script>
    <script src="menu.js"></script>
    <script src="main.js"></script>

    <script>
        // Proteção contra "Framebuffer status: Incomplete Attachment"
        window.addEventListener('load', () => {
            const tentarRotularCanvas = (tentativas = 0) => {
                const canvas = document.querySelector('#container-menu canvas');
                if (canvas) {
                    canvas.setAttribute('role', 'application');
                    canvas.setAttribute('aria-roledescription', 'game');
                    canvas.setAttribute('aria-label', 'Menu interativo de seleção de jogos educativos. Use as setas do teclado para navegar.');
                    canvas.setAttribute('tabindex', '0');
                    
                    canvas.focus(); 
                } else if (tentativas < 20) {
                    setTimeout(() => tentarRotularCanvas(tentativas + 1), 100);
                }
            };
            tentarRotularCanvas();
        });

        // PWA Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .catch(err => console.error('Erro ao registrar PWA', err));
            });
        }
    </script>
</body>

</html>
